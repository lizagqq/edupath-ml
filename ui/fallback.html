<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduPath ML</title>
<style>body{font:16px system-ui,sans-serif;max-width:1050px;margin:2rem auto;padding:0 1rem;color:#172638;background:#f6f8fb}h1{margin-bottom:.2rem}nav{display:flex;gap:.5rem;flex-wrap:wrap;margin:1.5rem 0}button,select{padding:.65rem;border:1px solid #c7d2df;border-radius:.4rem;background:white;cursor:pointer}button.active{background:#155e75;color:white}main,.card{background:#fff;padding:1.2rem;border-radius:.6rem;box-shadow:0 1px 5px #d9e0e8;margin:.7rem 0}.warn{background:#fff4d2;padding:.8rem;border-radius:.4rem}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:.6rem;border-bottom:1px solid #dde3e9}a{color:#155e75}.muted{color:#607080}.bar{background:#dce5ef;height:.8rem;border-radius:1rem}.fill{background:#158a9e;height:100%;border-radius:1rem}</style></head>
<body><h1>EduPath ML</h1><div class="muted">Оценка следующего ответа и индивидуальная траектория</div><p id="warning" class="warn"></p><label>Ученик: <select id="student"></select></label><nav id="nav"></nav><main id="main"></main>
<script>
const pages=['О проекте','Ученик','Оценка знаний','Индивидуальная траектория','Качество модели'];let current=0,info,profile,route,routeNote;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const get=async p=>{let r=await fetch(p);if(!r.ok)throw Error(r.status+' '+p);return r.json()};
async function selectStudent(){let id=document.querySelector('#student').value;profile=await get('/students/'+encodeURIComponent(id)+'/profile');let result=await get('/students/'+encodeURIComponent(id)+'/trajectory');route=result.trajectory;routeNote=result.trajectory_note;render()}
function render(){document.querySelector('#nav').innerHTML=pages.map((p,i)=>`<button class="${i===current?'active':''}" onclick="current=${i};render()">${p}</button>`).join('');let el=document.querySelector('#main');
if(current===0)el.innerHTML=`<h2>О проекте</h2><p>Анализ истории LMS, прогноз правильного следующего ответа и порядок повторения навыков.</p><p>Данные: ${esc(info.dataset)}.</p><p>Прогноз одного ответа не является точной оценкой полного владения предметом. Связи тем заданы вручную.</p>`;
if(current===1)el.innerHTML=`<h2>Ученик ${esc(profile.user_id)}</h2><p>Ответов: <b>${profile.responses}</b>. Наблюдаемая точность: <b>${(profile.observed_accuracy*100).toFixed(1)}%</b>.</p>`;
if(current===2)el.innerHTML='<h2>Оценка знаний</h2><table><tr><th>Навык</th><th>Ответов</th><th>Наблюдаемая точность</th><th>Прогноз</th><th>Достоверность</th></tr>'+profile.skills.map(x=>`<tr><td>${esc(x.display_name)}</td><td>${x.observations}</td><td>${x.observed_accuracy==null?'—':(x.observed_accuracy*100).toFixed(1)+'%'}</td><td>${(x.predicted_probability*100).toFixed(1)}%<div class="bar"><div class="fill" style="width:${x.predicted_probability*100}%"></div></div></td><td>${esc(x.confidence)}</td></tr>`).join('')+'</table>';
if(current===3)el.innerHTML='<h2>Индивидуальная траектория</h2>'+(route.length?route.map((x,i)=>`<article class="card"><h3>${i+1}. ${esc(x.skill_name)} · приоритет ${x.priority}</h3><p>${esc(x.reason)}</p>${x.material?`<p>${esc(x.material.explanation)}</p><p><b>Пример:</b> ${esc(x.material.example)}</p><a href="${esc(x.material.url)}" target="_blank" rel="noopener">${esc(x.material.source)}</a>`:'<p>Материал пока не добавлен.</p>'}</article>`).join(''):`<p>${esc(routeNote)}</p>`);
if(current===4)el.innerHTML=`<h2>Качество модели</h2><p>Групповое разбиение: ${info.train_students} учеников в train, ${info.test_students} в test. Seed: ${info.split_seed}.</p><table><tr><th>Модель</th><th>Accuracy</th><th>F1</th><th>ROC-AUC</th><th>Log loss</th><th>Brier</th></tr>${Object.entries(info.metrics).map(([n,m])=>`<tr><td>${esc(n)}</td><td>${m.accuracy.toFixed(3)}</td><td>${m.f1.toFixed(3)}</td><td>${m.roc_auc.toFixed(3)}</td><td>${m.log_loss.toFixed(3)}</td><td>${m.brier.toFixed(3)}</td></tr>`).join('')}</table><p>${esc(info.limitation)}</p>`}
async function start(){try{info=await get('/model/info');document.querySelector('#warning').textContent=info.dataset.includes('SYNTHETIC')?'ДЕМОНСТРАЦИОННЫЕ СИНТЕТИЧЕСКИЕ ДАННЫЕ. Метрики не подтверждают качество на ASSISTments.':'';let students=await get('/students?limit=100');document.querySelector('#student').innerHTML=students.map(x=>`<option>${esc(x)}</option>`).join('');document.querySelector('#student').onchange=selectStudent;await selectStudent()}catch(e){document.querySelector('#main').textContent='Ошибка загрузки: '+e}}
start();
</script></body></html>
